[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "india-job-agent"
version = "0.1.0"
description = "Source-driven India job ingestion engine"
requires-python = ">=3.12"
dependencies = [
    "fastapi",
    "uvicorn[standard]",
    "httpx",
    "sqlalchemy",
    "psycopg[binary]",
    "alembic",
    "pydantic-settings",
    "apscheduler",
    "selectolax",
    "beautifulsoup4",
    "lxml",
    "rapidfuzz",
    "python-dateutil",
    "tenacity",
    "orjson",
    "pytest",
    "pytest-asyncio",
    "respx",
    "openai",
]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
asyncio_mode = "auto"
